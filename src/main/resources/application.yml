spring:
  application:
    name: basketball-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/bbm
    username: bbm
    password: bbm
  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет Flyway. Когда сущности будут готовы, можно включить validate.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025

server:
  port: 8080

app:
  base-url: http://localhost:8080
  mail-from: no-reply@bbmanager.local
  max-saves-per-user: 5
