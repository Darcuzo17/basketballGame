services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bbm
      POSTGRES_USER: bbm
      POSTGRES_PASSWORD: bbm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Локальная почта для проверки писем подтверждения: интерфейс на http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
